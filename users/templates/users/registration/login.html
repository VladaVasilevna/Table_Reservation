{% extends 'reserv/base.html' %}
{% block content %}
<div class="container" style="max-width: 500px;">
    <div class="card shadow">
        <div class="card-body">
            <h3 class="card-title text-center mb-4">Вход в аккаунт</h3>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Пожалуйста, исправьте ошибки ниже.
                    </div>
                {% endif %}

                {{ form.as_p }}

                <div class="mb-3 text-left">
                    <a href="{% url 'users:password_reset' %}">Забыли пароль?</a>
                </div>

                <button type="submit" class="btn btn-warning w-100">Войти</button>
            </form>

            <hr>
            <p class="text-center">
                Нет аккаунта?
                <a href="{% url 'users:register' %}">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
