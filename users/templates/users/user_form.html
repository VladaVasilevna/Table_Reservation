{% extends "reserv/base.html" %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-body">
            <h3 class="card-title text-center mb-4">Регистрация гостя</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-warning w-100">Зарегистрироваться</button>
            </form>
            <hr>
            <p class="text-center">
                Уже есть аккаунт?
                <a href="{% url 'users:login' %}">Войти</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
