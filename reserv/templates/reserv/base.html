{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Savor{% endblock %}</title>
  <link href="{% static 'reserv/assets/img/favicon.png' %}" rel="icon">
  <link href="{% static 'reserv/assets/img/apple-touch-icon.png' %}" rel="apple-touch-icon">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Satisfy:wght@400&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="{% static 'reserv/assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'reserv/assets/vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
  <link href="{% static 'reserv/assets/vendor/aos/aos.css' %}" rel="stylesheet">
  <link href="{% static 'reserv/assets/vendor/glightbox/css/glightbox.min.css' %}" rel="stylesheet">
  <link href="{% static 'reserv/assets/vendor/swiper/swiper-bundle.min.css' %}" rel="stylesheet">
  <link href="{% static 'reserv/assets/css/main.css' %}" rel="stylesheet">

  <!-- Main CSS File -->
  <link href="{% static 'reserv/assets/css/main.css' %}" rel="stylesheet">

</head>
<body>
  {% include 'reserv/includes/header.html' %}
  <main class="container my-4">
    {% block content %}{% endblock %}
  </main>
  {% include 'reserv/includes/footer.html' %}
  <!-- Vendor JS Files -->
    <script src="{% static 'reserv/assets/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'reserv/assets/vendor/php-email-form/validate.js' %}"></script>
    <script src="{% static 'reserv/assets/vendor/aos/aos.js' %}"></script>
    <script src="{% static 'reserv/assets/vendor/glightbox/js/glightbox.min.js' %}"></script>
    <script src="{% static 'reserv/assets/vendor/imagesloaded/imagesloaded.pkgd.min.js' %}"></script>
    <script src="{% static 'reserv/assets/vendor/isotope-layout/isotope.pkgd.min.js' %}"></script>
    <script src="{% static 'reserv/assets/vendor/swiper/swiper-bundle.min.js' %}"></script>
    <script src="{% static 'reserv/assets/js/main.js' %}"></script>

    <!-- Main JS File -->
    <script src="{% static 'reserv/assets/js/main.js' %}"></script>
</body>
</html>
