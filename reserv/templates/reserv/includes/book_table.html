{% load static %}
<!-- Section Title -->
<div class="container section-title" data-aos="fade-up">
    <h2>Бронирование</h2>
    <div><span>Book a</span> <span class="description-title">Table</span></div>
</div><!-- End Section Title -->

<div class="container">
    <div class="row g-0" data-aos="fade-up" data-aos-delay="100">
        {% load static %}
        <div class="col-lg-4 reservation-img" style="background-image: url('{% static 'reserv/assets/img/reservation.jpg' %}');"></div>
        <div class="col-lg-8 d-flex align-items-center reservation-form-bg" data-aos="fade-up" data-aos-delay="200">

            <form method="post" action="{% url 'home' %}" class="php-email-form">
                {% csrf_token %}
                <div class="row gy-4">
                    <div class="col-lg-4 col-md-6">
                        {{ form.name }}
                    </div>
                    <div class="col-lg-4 col-md-6">
                        {{ form.email }}
                    </div>
                    <div class="col-lg-4 col-md-6">
                        {{ form.phone }}
                    </div>
                    <div class="col-lg-4 col-md-6">
                        {{ form.date }}
                    </div>
                    <div class="col-lg-4 col-md-6">
                        {{ form.time }}
                    </div>
                    <div class="col-lg-4 col-md-6">
                        {{ form.people }}
                    </div>
                </div>
                <div class="form-group mt-3">
                    {{ form.message }}
                </div>
                <div class="text-center mt-3">
                    <button type="submit" name="booking_submit">Забронировать</button>
                </div>
            </form>

        </div><!-- End Reservation Form -->
    </div>
</div>
